<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f56d6">
  <title>Controle de Cobranças</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <aside class="sidebar" id="sidebar" aria-label="Menu principal">
      <div class="brand">
        <span class="brand-mark" id="brand-mark"></span>
        <div>
          <strong>Controle de Cobranças</strong>
          <small>Roupas</small>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <p class="sidebar-note">Os dados ficam salvos somente neste navegador. Faça um backup em Configurações.</p>
    </aside>
    <div class="scrim" data-act="close-menu"></div>

    <div class="main">
      <header class="mobile-bar">
        <button class="icon-btn" id="btn-menu" data-act="open-menu" aria-label="Abrir menu"></button>
        <span class="mobile-title" id="mobile-title"></span>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>

  </div>

  <div id="modal-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
